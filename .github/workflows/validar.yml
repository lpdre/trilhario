name: Validar Trilhário

on:
  pull_request:
    paths:
      - 'assets/**'
      - 'index.html'
      - 'testes/**'
      - '*.py'
      - '.github/workflows/validar.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressao:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Testes offline
        run: |
          python -m py_compile recolher.py normalizar_eventos.py fontes_oficiais.py monitorizacao_fontes.py consolidar_catalogo.py localizacoes.py precalcular_rotas.py
          python -m unittest discover -s testes -p 'test_*.py' -v
          node --check assets/js/trilhario.js
          node --check assets/js/trilhario-routes.js
          node testes/test_catalogo_browser.cjs
          node testes/test_localizacoes_browser.cjs
          node testes/test_rotas_browser.cjs
          node testes/test_interface_browser.cjs
          node testes/test_comparacao_browser.cjs
