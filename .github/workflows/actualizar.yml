name: Procurar e validar caminhadas

on:
  schedule:
    # Todos os dias às 06:05 em Portugal, incluindo a mudança de hora.
    - cron: '5 6 * * *'
      timezone: 'Europe/Lisbon'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: atualizar-caminhadas
  cancel-in-progress: false

jobs:
  recolha:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obter ficheiros
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Procurar eventos
        run: python recolher.py
      - name: Corrigir dados e validar catálogo
        run: python normalizar_eventos.py
      - name: Publicar catálogo se existirem alterações
        id: publicar
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- eventos.json)" ]; then
            echo "Sem alterações no catálogo."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eventos.json
          git commit -m "Actualizar e validar agenda de caminhadas"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Pedir nova publicação do GitHub Pages (se activado)
        if: steps.publicar.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
