name: Procurar e validar caminhadas

on:
  schedule:
    # Todos os dias às 06:05 em Portugal, incluindo a mudança de hora.
    - cron: '5 6 * * *'
      timezone: 'Europe/Lisbon'
  workflow_dispatch:
  push:
    paths:
      - 'precalcular_rotas.py'
      - 'testes/test_catalogo_unico.py'
      - '.github/workflows/actualizar.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: atualizar-caminhadas
  cancel-in-progress: false

jobs:
  recolha:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obter ficheiros
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Validar código versionado e testes offline (sem migrações)
        run: |
          python -m py_compile recolher.py normalizar_eventos.py fontes_oficiais.py monitorizacao_fontes.py consolidar_catalogo.py localizacoes.py precalcular_rotas.py
          python - <<'PREFLIGHT'
          import recolher
          modes = {entry.get('mode') for entry in recolher.SOURCES}
          assert {'rb', 'smile'} <= modes, 'Faltam fontes oficiais RB ou Smile no colector versionado'
          assert not any(entry.get('mode') == 'agregador' for entry in recolher.SOURCES), 'O agregador antigo não pode estar activo'
          for name in ('date_from', 'parse_meta', 'deduplicate', 'is_disallowed_aggregator_event'):
              assert callable(getattr(recolher, name, None)), f'Colector sem a função {name}'
          print('Colector validado; sem migrações automáticas.')
          PREFLIGHT
          python -m unittest discover -s testes -p 'test_localizacoes.py' -v
          python -m unittest discover -s testes -p 'test_monitorizacao.py' -v
          python -m unittest discover -s testes -p 'test_catalogo_unico.py' -v
          python -m unittest discover -s testes -p 'test_rotas_precalculadas.py' -v
          node --check assets/js/trilhario.js
          node testes/test_catalogo_browser.cjs
          node testes/test_localizacoes_browser.cjs
      - name: Verificar correcções de extracção sem consultar sites
        shell: bash
        run: |
          python - <<'PYTEST'
          import recolher
          from bs4 import BeautifulSoup
          from datetime import date
          assert recolher.date_from('2026-11-01T09:00:00+00:00') == date(2026,11,1)
          e={'price':None}
          recolher.parse_meta(BeautifulSoup('<main>Duração: 3h30. Crianças 5 €. Preço por participante 20 €</main>','html.parser'),e)
          assert e.get('price') == 20, e
          assert e.get('duration') == 3.5, e
          # Um texto genérico com "gratuita" não prova que a caminhada é gratuita.
          unknown={'price':None}
          recolher.parse_meta(BeautifulSoup('<main>Newsletter gratuita e condições gerais</main>','html.parser'),unknown)
          assert unknown.get('price') is None, unknown
          # O preço da reserva oficial prevalece sobre um zero indevido anterior.
          paid={'price':0}
          recolher.extra_source_meta(BeautifulSoup('<main>Faça Já A Sua Reserva 15,00€ Por pessoa</main>','html.parser'),paid,'GreenTrekker')
          assert paid.get('price') == 15, paid
          a={'id':'a','title':'Trilho das Fragas','date':'2026-11-01','organizer':'X','url':'https://site.pt/agenda'}
          b={'id':'b','title':'Trilho do Rio','date':'2026-11-01','organizer':'X','url':'https://site.pt/agenda'}
          assert len(recolher.deduplicate([a,b])) == 2
          print('Testes de integração Fase 2 OK')
          PYTEST
      - name: Recolher eventos e diagnosticar cada fonte
        run: python monitorizacao_fontes.py
      - name: Corrigir dados e validar catálogo
        run: python normalizar_eventos.py
      - name: Verificar catálogo e garantir que o código não mudou
        shell: bash
        run: |
          python - <<'VALIDATE'
          import json
          from datetime import date
          from pathlib import Path
          data = json.loads(Path('eventos.json').read_text(encoding='utf-8'))
          assert isinstance(data, dict), 'Catálogo inválido: raiz não é objecto'
          events = data.get('events')
          assert isinstance(events, list) and events, 'Catálogo vazio: publicação bloqueada'
          ids = set()
          for event in events:
              assert isinstance(event, dict), 'Evento não é objecto'
              eid = event.get('id')
              assert isinstance(eid, str) and eid, 'Evento sem ID válido'
              assert eid not in ids, f'ID duplicado: {eid}'
              ids.add(eid)
              assert isinstance(event.get('title'), str) and event['title'].strip(), f'Evento {eid} sem título'
              date.fromisoformat(event['date'])
          print(f'Catálogo validado: {len(events)} eventos, {len(ids)} IDs únicos.')
          VALIDATE
          git diff --exit-code -- recolher.py normalizar_eventos.py fontes_oficiais.py monitorizacao_fontes.py consolidar_catalogo.py localizacoes.py precalcular_rotas.py testes/test_rotas_precalculadas.py excepcoes_catalogo.json .github/workflows/actualizar.yml
      - name: Pré-calcular distâncias das capitais para pontos GPS confirmados
        run: python precalcular_rotas.py
      - name: Publicar catálogo e cache de viagens
        id: publicar
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- eventos.json rotas_precalculadas.json)" ]; then
            echo "Sem alterações no catálogo ou na cache de viagens."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- eventos.json rotas_precalculadas.json
          git commit -m "Actualizar catálogo e rotas pré-calculadas"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Pedir nova publicação do GitHub Pages (se activado)
        if: steps.publicar.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
